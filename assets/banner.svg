<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Wraith — invisible AI copilot for power users">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050705"/>
      <stop offset="0.6" stop-color="#0a0f08"/>
      <stop offset="1" stop-color="#101a0c"/>
    </linearGradient>
    <linearGradient id="acid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#17240f" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.65"/>

  <g font-family="Consolas, 'Courier New', monospace" fill="#a3e635">
    <text x="760" y="92" font-size="13" opacity="0.75">$ wraith --context screen</text>
    <text x="760" y="116" font-size="13" opacity="0.55">&gt; ocr … 142ms</text>
    <text x="760" y="140" font-size="13" opacity="0.55">&gt; route … groq/llama-3.3-70b</text>
    <text x="760" y="164" font-size="13" opacity="0.85">&gt; answer ▍</text>
  </g>
  <g fill="none" stroke="url(#acid)" stroke-width="2">
    <rect x="736" y="60" width="300" height="132" rx="6"/>
  </g>
  <g fill="none" stroke="#22c55e" stroke-width="1.4" opacity="0.6">
    <path d="M1036 96 H1108 M1036 128 H1082 M1036 160 H1120"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="132" fill="#a3e635" font-size="17" letter-spacing="6" font-weight="600">INVISIBLE AI COPILOT</text>
    <text x="70" y="206" fill="#ffffff" font-size="76" font-weight="700" letter-spacing="-1">Wraith</text>
    <text x="73" y="247" fill="#c8d6c0" font-size="21">A terminal overlay that sees your screen and hears your meeting.</text>
    <text x="73" y="281" fill="#728a66" font-size="15" letter-spacing="1.5">OCR  ·  VOICE  ·  CLIPBOARD  ·  PLAYBOOKS  ·  STREAMING</text>
  </g>
  <rect x="0" y="316" width="1280" height="4" fill="url(#acid)"/>
</svg>
